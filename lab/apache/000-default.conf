<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/vulnerablewordpress

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory /var/www/vulnerablewordpress>
        Options +Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
